<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Only For Her — Opening soon</title>
    <meta
      name="description"
      content="Only For Her is getting ready. Our website opens soon."
    />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#640F2B" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --sand: #f5e7d7;
        --wine: #640f2b;
        --bronze: #b88636;
        --gold: #d8b16a;
        --ivory: #fff8ef;

        --display: "Fraunces", Georgia, "Times New Roman", serif;
        --text: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;

        --pad: clamp(20px, 4vw, 56px);
        --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        background: var(--sand);
        color: var(--wine);
        font-family: var(--text);
        font-size: 18px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        display: grid;
        grid-template-columns: 1.15fr 1fr;
        min-height: 100vh;
        min-height: 100dvh;
      }

      /* left: the message */
      .copy {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 56px;
        padding: var(--pad);
        background: var(--sand);
      }

      .brand {
        font-family: var(--display);
        font-weight: 600;
        font-size: 22px;
        letter-spacing: -0.01em;
        color: var(--wine);
        text-decoration: none;
      }

      .message {
        max-width: 640px;
      }

      h1 {
        margin: 0;
        font-family: var(--display);
        font-weight: 500;
        font-size: clamp(2.75rem, 6.4vw, 6.25rem);
        line-height: 0.98;
        letter-spacing: -0.035em;
        color: var(--wine);
        text-wrap: balance;
      }

      .lede {
        margin: 36px 0 0;
        max-width: 30em;
        font-size: clamp(1.05rem, 1.4vw, 1.25rem);
        color: var(--wine);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px 28px;
        margin-top: 40px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        min-height: 52px;
        padding: 0 30px;
        border-radius: 999px;
        background: var(--wine);
        color: var(--ivory);
        font: 600 16px/1 var(--text);
        text-decoration: none;
        transition:
          transform 0.25s var(--ease),
          background-color 0.25s var(--ease);
      }
      .btn:hover {
        background: var(--bronze);
        transform: translateY(-2px);
      }
      .btn:active {
        transform: translateY(0) scale(0.98);
      }

      .note {
        font-size: 16px;
      }

      a:focus-visible {
        outline: 3px solid var(--bronze);
        outline-offset: 4px;
      }

      .foot {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px 24px;
        font-size: 15px;
      }

      /* right: the door that is about to open */
      .scene {
        position: relative;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        overflow: hidden;
        padding: var(--pad) var(--pad) 0;
        background: var(--wine);
      }
      .door {
        display: block;
        width: min(100%, 520px);
        height: auto;
        max-height: 92vh;
      }

      .sign {
        transform-origin: 200px 238px;
        animation: sway 5.5s ease-in-out infinite;
      }
      .glow {
        animation: breathe 4s ease-in-out infinite;
        transform-origin: 200px 360px;
      }

      @keyframes sway {
        0%,
        100% {
          transform: rotate(-3deg);
        }
        50% {
          transform: rotate(3deg);
        }
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }

      /* entrance */
      .rise {
        opacity: 0;
        transform: translateY(24px);
        animation: rise 0.9s var(--ease) forwards;
      }
      .d1 {
        animation-delay: 0.05s;
      }
      .d2 {
        animation-delay: 0.18s;
      }
      .d3 {
        animation-delay: 0.3s;
      }
      .d4 {
        animation-delay: 0.42s;
      }
      .d5 {
        animation-delay: 0.54s;
      }
      @keyframes rise {
        to {
          opacity: 1;
          transform: none;
        }
      }

      .scene .door {
        opacity: 0;
        transform: translateY(40px);
        animation: rise 1.1s 0.2s var(--ease) forwards;
      }

      @media (max-width: 860px) {
        .page {
          grid-template-columns: 1fr;
        }
        .copy {
          gap: 40px;
          padding-bottom: 48px;
        }
        .scene {
          min-height: 420px;
          padding-top: 40px;
        }
        .door {
          width: min(78%, 380px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .rise,
        .scene .door {
          animation: none;
          opacity: 1;
          transform: none;
        }
        .sign,
        .glow {
          animation: none;
        }
        .btn {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <main class="copy">
        <a class="brand rise d1" href="/" aria-label="Only For Her"
          >Only For Her</a
        >

        <div class="message">
          <h1 class="rise d2">Something lovely is on its way.</h1>
          <p class="lede rise d3">
            Our website is being made with care and isn't open just yet. Check
            back soon, or write to us and we'll let you know the moment the
            doors open.
          </p>
          <div class="actions rise d4">
            <a
              class="btn"
              href="mailto:Ofhjewellery@gmail.com?subject=Tell%20me%20when%20you%20open"
              >Tell me when it opens</a
            >
            <span class="note">Ofhjewellery@gmail.com</span>
          </div>
        </div>

        <div class="foot rise d5">
          <span>Opening soon</span>
          <span>&copy; <span id="y">2026</span> Only For Her</span>
        </div>
      </main>

      <aside class="scene" aria-hidden="true">
        <svg class="door" viewBox="0 0 400 560" role="img" focusable="false">
          <!-- frame -->
          <path d="M30 560V200a170 170 0 0 1 340 0v360Z" fill="#FFF8EF" />
          <!-- warm light from inside -->
          <path d="M78 560V205a122 122 0 0 1 244 0v355Z" fill="#B88636" />
          <g class="glow">
            <path d="M92 560V208a108 108 0 0 1 216 0v352Z" fill="#D8B16A" />
          </g>
          <!-- door leaves -->
          <path d="M92 560V208a108 108 0 0 1 108-108v460Z" fill="#F5E7D7" />
          <path d="M200 100a108 108 0 0 1 108 108v352H200Z" fill="#FFF8EF" />
          <path d="M200 100v460" stroke="#B88636" stroke-width="3" />
          <!-- panels -->
          <path
            d="M118 520V240a82 82 0 0 1 70-81v361Z"
            fill="#D8B16A"
            opacity=".55"
          />
          <path
            d="M212 159a82 82 0 0 1 70 81v280h-70Z"
            fill="#D8B16A"
            opacity=".55"
          />
          <!-- handles -->
          <circle cx="186" cy="370" r="7" fill="#640F2B" />
          <circle cx="214" cy="370" r="7" fill="#640F2B" />
          <!-- hanging sign -->
          <g class="sign">
            <rect x="198" y="40" width="4" height="198" fill="#B88636" />
            <rect
              x="116"
              y="238"
              width="168"
              height="64"
              rx="6"
              fill="#640F2B"
            />
            <rect
              x="124"
              y="246"
              width="152"
              height="48"
              rx="3"
              fill="#640F2B"
              stroke="#D8B16A"
              stroke-width="2"
            />
            <text
              x="200"
              y="278"
              text-anchor="middle"
              font-family="Fraunces, Georgia, serif"
              font-size="24"
              font-weight="500"
              fill="#F5E7D7"
            >
              Opening soon
            </text>
          </g>
        </svg>
      </aside>
    </div>
    <script>
      document.getElementById("y").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
